# Go 推理网关 — 示例配置文件
# 
# 网关作用：在客户端和 vLLM 推理后端之间做一层代理，提供：
#   - 多后端轮询负载均衡（round-robin）
#   - 失败自动重试（跳过已失败后端）
#   - SSE 流式代理（stream=true 时透传）
#   - 自动健康检查（health_check_path 可配置，适配各家引擎约定）
#   - Prometheus 指标暴露（/metrics）
#   - 后端状态查看（/backends）
#   - 超时控制 + 结构化日志（含 X-Request-ID）
#   - 按 model 路由（不同模型分发到不同后端池）

gateway:
  port: 8080          # 网关监听端口
  timeout: "120s"     # 后端请求超时（vLLM 推理可能较慢，设大一些）
  max_retries: 1      # 失败重试次数（0=不重试，1=重试1次，建议 1-2）

  # ---- 请求体上限 ----
  # Go 的 net/http 默认不限制请求体大小，任何人都能 POST 一个 GB 级 body 打满网关内存。
  # 默认 16MB：72B 模型 32k 上下文的请求体通常 100KB~500KB；若接 128k+ 上下文模型
  # 请按实际调大（如 "32MB"），而不是让调用方分片。填 "0" = 不限制（不推荐）。
  max_body_size: "16MB"

  # ---- 流式（SSE）超时 ----
  # 流式请求不能用整体超时（长生成会被截断），但也不能完全没有兜底——
  # 后端卡死（GPU OOM / 进程假死）时连接会永久挂起。
  #
  # stream_idle_timeout：两次数据块之间的最大间隔，收到数据即重置。
  #   从发请求起算，所以「等首字节」和「吐一半卡死」两种故障都覆盖。
  #   默认 120s；若你的长上下文 prefill 可能超过 2 分钟，请调大。填 "0" = 不启用（不建议）。
  stream_idle_timeout: "120s"

  # stream_max_duration：单条流的最长总时长，兜底「极慢但一直在吐」的连接。
  #   默认 "0"（不限制）。误杀风险高于空闲超时，一般保持关闭。
  stream_max_duration: "0"

backends:
  # ========== AutoDL vLLM 后端 ==========
  # 启动 vLLM 后，需要在 AutoDL 控制台获取 SSH 隧道或公网 IP。
  # 方式一（推荐）：SSH 端口转发
  #   本机执行: ssh -L 8000:localhost:8000 -p <SSH端口> root@<AutoDL_IP>
  #   url 填: http://localhost:8000
  #
  # 方式二：AutoDL 自定义服务（暴露公网端口）
  #   在 AutoDL 控制台 → 实例 → 自定义服务 → 添加 8000 端口
  #   url 填: http://<AutoDL_公网IP>:<暴露端口>
  #
  # pool 字段指定该后端归属的后端池，按 model 路由时生效
  #
  # health_check_path / health_check_timeout 均可省略：
  #   health_check_path    默认 "/health"（vLLM / TGI）
  #                        Ollama 需填 "/"，SGLang 需填 "/health_generate"
  #   health_check_timeout 默认 "3s"（刻意不复用 gateway.timeout，避免慢后端拖死探测）
  - name: "auto-vllm-4080"
    url: "http://localhost:8000"     # ← 修改为实际地址
    health_check_interval: "10s"
    pool: "default"                  # 归属默认池

  # 第二个后端池示例：本地 Ollama（去掉注释即可启用）
  # 注意 Ollama 的健康端点与 vLLM 不同，必须显式指定 health_check_path
  # - name: "ollama-local"
  #   url: "http://localhost:11434"
  #   health_check_path: "/"
  #   health_check_timeout: "3s"
  #   health_check_interval: "15s"
  #   pool: "local"

# ========== 按 model 路由 ==========
# 未显式声明的 model 会自动落入 default_pool。
default_pool: "default"

# model 名 → 后端池 的映射（精确匹配）
models:
  - name: "/root/autodl-tmp/models/Qwen2.5-7B-Instruct"
    pool: "default"
  # - name: "llama3-8b"
  #   pool: "local"

# ========== 启动方式 ==========
# 
# 1. 在本机（Windows）启动网关:
#    cd inference-gateway
#    go run ./cmd/gateway --config config.yaml
#
# 2. 普通请求测试:
#    curl http://localhost:8080/v1/chat/completions \
#      -H "Content-Type: application/json" \
#      -d '{"model":"/root/autodl-tmp/models/Qwen2.5-7B-Instruct","messages":[{"role":"user","content":"Hello"}],"max_tokens":50}'
#
# 3. 流式请求测试:
#    curl http://localhost:8080/v1/chat/completions \
#      -H "Content-Type: application/json" \
#      -d '{"model":"/root/autodl-tmp/models/Qwen2.5-7B-Instruct","messages":[{"role":"user","content":"Hello"}],"stream":true}'
#
# 4. 查看指标:
#    curl http://localhost:8080/metrics
#
# 5. 查看后端状态:
#    curl http://localhost:8080/backends | python -m json.tool
